<script>
  // Micro-interactions for interactive filter sheet components
  document.addEventListener('DOMContentLoaded', () => {
    // Sort radio simulation
    const sortChips = document.querySelectorAll('.sort-chip');
    sortChips.forEach(chip => {
      chip.addEventListener('click', () => {
        sortChips.forEach(c => {
          c.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
          c.classList.add('bg-surface-container-low', 'text-on-surface');
          const icon = c.querySelector('.check-icon');
          if (icon) {
            icon.classList.add('hidden');
            icon.classList.remove('text-on-primary');
          }
        });
        chip.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
        chip.classList.remove('bg-surface-container-low', 'text-on-surface');
        const activeIcon = chip.querySelector('.check-icon');
        if (activeIcon) {
          activeIcon.classList.remove('hidden');
          activeIcon.classList.add('text-on-primary');
        }
      });
    });

    // Checkbox toggle simulation
    const filterRows = document.querySelectorAll('.filter-row');
    filterRows.forEach(row => {
      row.addEventListener('click', (e) => {
        const input = row.querySelector('.status-check');
        const box = row.querySelector('.checkbox-box');
        if (!input || !box) return;
        
        input.checked = !input.checked;
        if (input.checked) {
          box.classList.remove('bg-surface-container-highest', 'text-transparent');
          box.classList.add('bg-primary-container', 'text-on-primary');
        } else {
          box.classList.remove('bg-primary-container', 'text-on-primary');
          box.classList.add('bg-surface-container-highest', 'text-transparent');
        }
        recalcCount();
      });
    });

    // Toggle card buttons
    const toggleCards = document.querySelectorAll('.toggle-card');
    toggleCards.forEach(card => {
      card.addEventListener('click', () => {
        const isCurrentlyActive = card.getAttribute('data-toggle') === 'true';
        const indicator = card.querySelector('.check-indicator');
        if (isCurrentlyActive) {
          card.setAttribute('data-toggle', 'false');
          card.classList.add('opacity-70');
          card.classList.remove('shadow-sm');
          if (indicator) {
            indicator.textContent = 'radio_button_unchecked';
            indicator.classList.remove('text-primary', 'text-tertiary');
            indicator.classList.add('text-outline-variant');
          }
        } else {
          card.setAttribute('data-toggle', 'true');
          card.classList.remove('opacity-70');
          card.classList.add('shadow-sm');
          if (indicator) {
            indicator.textContent = 'check_circle';
            indicator.classList.remove('text-outline-variant');
            indicator.classList.add('text-primary');
          }
        }
        recalcCount();
      });
    });

    // Category chips selection
    const categoryChips = document.querySelectorAll('.category-chip');
    categoryChips.forEach(chip => {
      chip.addEventListener('click', () => {
        categoryChips.forEach(c => {
          c.classList.remove('bg-secondary', 'text-on-secondary', 'shadow-sm');
          c.classList.add('bg-surface-container-low', 'text-on-surface');
        });
        chip.classList.add('bg-secondary', 'text-on-secondary', 'shadow-sm');
        chip.classList.remove('bg-surface-container-low', 'text-on-surface');
        recalcCount();
      });
    });

    // Dynamic customer count simulation
    const resultCounter = document.getElementById('result-counter');
    function recalcCount() {
      let activeCount = 16;
      document.querySelectorAll('.status-check:checked').forEach(c => {
        activeCount += parseInt(c.getAttribute('data-count') || '0', 10);
      });
      document.querySelectorAll('.toggle-card[data-toggle="true"]').forEach(() => {
        activeCount += 4;
      });
      if (resultCounter) {
        resultCounter.textContent = Math.max(1, activeCount);
      }
    }

    // Reset All button
    const resetBtn = document.getElementById('reset-btn');
    const clearBtn = document.getElementById('clear-filters-btn');
    
    function resetFilters() {
      // Clear status checks
      document.querySelectorAll('.filter-row').forEach(row => {
        const input = row.querySelector('.status-check');
        const box = row.querySelector('.checkbox-box');
        if (input && box) {
          input.checked = false;
          box.classList.remove('bg-primary-container', 'text-on-primary');
          box.classList.add('bg-surface-container-highest', 'text-transparent');
        }
      });
      // Reset toggles
      toggleCards.forEach(card => {
        card.setAttribute('data-toggle', 'false');
        card.classList.add('opacity-70');
        card.classList.remove('shadow-sm');
        const ind = card.querySelector('.check-indicator');
        if (ind) {
          ind.textContent = 'radio_button_unchecked';
          ind.className = 'material-symbols-outlined text-[18px] text-outline-variant check-indicator';
        }
      });
      // Select All Products
      categoryChips.forEach((c, idx) => {
        if (idx === 0) {
          c.classList.add('bg-secondary', 'text-on-secondary', 'shadow-sm');
          c.classList.remove('bg-surface-container-low', 'text-on-surface');
        } else {
          c.classList.remove('bg-secondary', 'text-on-secondary', 'shadow-sm');
          c.classList.add('bg-surface-container-low', 'text-on-surface');
        }
      });
      if (resultCounter) resultCounter.textContent = '86';
    }

    if (resetBtn) resetBtn.addEventListener('click', resetFilters);
    if (clearBtn) clearBtn.addEventListener('click', resetFilters);
  });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(8,38,74,0.06)]" data-active-classes="text-primary-container font-semibold"><div class="flex justify-around items-center h-16 px-gutter"><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="dashboard" href="#"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-label-sm text-label-sm mt-0.5">Dashboard</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] h-12 transition-colors text-primary-container font-semibold" data-path="customers" href="#"><span class="material-symbols-outlined text-[24px]">group</span><span class="font-label-sm text-label-sm mt-0.5">Customers</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="technicians" href="#"><span class="material-symbols-outlined text-[24px]">engineering</span><span class="font-label-sm text-label-sm mt-0.5">Technicians</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined text-[24px]">settings</span><span class="font-label-sm text-label-sm mt-0.5">Settings</span></a></div></nav></body></html>
